<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Змейка</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #1a1a1a;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 600px;
      max-height: 900px;
      display: block;
    }
    canvas {
      display: block;
      background: #0f0f0f;
      touch-action: none;
      image-rendering: pixelated;
      position: absolute;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    /* Экран старта */
    #start-screen {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      text-align: center;
    }

    /* Экран Game Over + Рейтинг */
    #game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { margin: 0 0 20px; color: #ccc; font-size: 16px; }
    .btn-primary {
      padding: 18px 36px;
      font-size: 18px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
    }
    .btn-primary:active { background: #388e3c; }

    #score-board {
      position: absolute;
      top: 14px;
      left: 14px;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 1px 1px 2px black;
      z-index: 10;
    }

    .controls {
      position: absolute;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: 64px 64px 64px;
      grid-template-rows: 64px 64px 64px;
      gap: 12px;
      z-index: 10;
    }
    button {
      width: 64px;
      height: 64px;
      border: none;
      background: rgba(255,255,255,0.12);
      color: white;
      border-radius: 14px;
      font-size: 28px;
      user-select: none;
      touch-action: manipulation;
      outline: none;
    }
    button:active { background: rgba(255,255,255,0.35); }

    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 3; }
    #btn-right { grid-column: 3; grid-row: 2; }

    /* Стили для рейтинга */
    .leaderboard {
      background: #2b2b2b;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 12px 18px;
      width: 100%;
      max-width: 320px;
      margin-bottom: 24px;
    }
    .leaderboard-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #aaa;
      text-align: left;
    }
    .rank-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #333;
    }
    .rank-row:last-child { border-bottom: none; }
    .rank-num {
      color: #ff9800;
      font-weight: bold;
    }
    .rank-score {
      font-weight: bold;
      color: #ddd;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="score-board">Счёт: <span id="score">0</span></div>
    <canvas id="game"></canvas>

    <!-- Экран старта -->
    <div id="start-screen">
      <h1>Змейка</h1>
      <p>Нажимай кнопки на экране</p>
      <button class="btn-primary" id="btn-start">Начать игру</button>
    </div>

    <!-- Экран Game Over с рейтингом -->
    <div id="game-over-screen" style="display:none;">
      <h1>Игра окончена</h1>
      <p>Твой счёт: <span id="final-score" style="color:#ff9800;font-weight:bold;">0</span></p>

      <div class="leaderboard">
        <div class="leaderboard-title">Топ-5 результатов</div>
        <div id="leaderboard-list"></div>
      </div>

      <button class="btn-primary" id="btn-restart">Играть снова</button>
    </div>

    <div class="controls">
      <button id="btn-up">&#8593;</button>
      <button id="btn-left">&#8592;</button>
      <button id="btn-down">&#8595;</button>
      <button id="btn-right">&#8594;</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // --- Параметры игры ---
    let tileCount = 20;
    let gridSize = 0;
    const moveInterval = 260;

    let snake = [];
    let food = { x: 15, y: 15 };
    let dx = 1, dy = 0;
    let nextDx = dx, nextDy = dy;
    let score = 0;

    let animationId;
    let isGameRunning = false;
    let lastMoveTime = 0;

    // --- Рейтинг (LocalStorage) ---
    const MAX_RANK_SIZE = 5;

    function getLeaderboard() {
      const stored = localStorage.getItem('snake_leaderboard');
      if (!stored) return [];
      try {
        const parsed = JSON.parse(stored);
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];
      }
    }

    function saveLeaderboard(list) {
      localStorage.setItem('snake_leaderboard', JSON.stringify(list));
    }

    function updateLeaderboard(newScore) {
      let list = getLeaderboard();
      // Добавляем текущий результат без имени
      list.push({ score: newScore });
      // Сортируем по убыванию
      list.sort((a, b) => b.score - a.score);
      // Оставляем только топ-5
      list = list.slice(0, MAX_RANK_SIZE);
      saveLeaderboard(list);
      return list;
    }

    function renderLeaderboard(list, currentScore) {
      const container = document.getElementById('leaderboard-list');
      container.innerHTML = '';
      list.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'rank-row';
        const isCurrent = item.score === currentScore;
        row.innerHTML = `
          <span class="rank-num">${index + 1}</span>
          <span class="rank-score" ${isCurrent ? 'style="color:#4caf50"' : ''}>${item.score}</span>
        `;
        container.appendChild(row);
      });
    }

    // --- Игровые функции ---
    function resize() {
      const container = document.getElementById('game-container');
      const cw = container.clientWidth;
      const ch = container.clientHeight;

      tileCount = (cw < 420) ? 16 : 20;
      const maxTileSize = Math.floor(Math.min(cw, ch - 128) / tileCount);
      gridSize = Math.max(16, maxTileSize);

      canvas.width = tileCount * gridSize;
      canvas.height = tileCount * gridSize;
    }

    function resetGame() {
      snake = [
        { x: Math.floor(tileCount/2), y: Math.floor(tileCount/2) },
        { x: Math.floor(tileCount/2)-1, y: Math.floor(tileCount/2) },
        { x: Math.floor(tileCount/2)-2, y: Math.floor(tileCount/2) }
      ];
      placeFood();
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      updateScore();
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-over-screen').style.display = 'none';
    }

    function updateScore() {
      document.getElementById('score').textContent = score;
    }

    function placeFood() {
      const maxAttempts = 200;
      for (let i = 0; i < maxAttempts; i++) {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);

        let occupied = false;
        for (const part of snake) {
          if (part.x === food.x && part.y === food.y) {
            occupied = true;
            break;
          }
        }
        if (!occupied) return;
      }

      for (let x = 0; x < tileCount; x++) {
        for (let y = 0; y < tileCount; y++) {
          let occupied = false;
          for (const part of snake) {
            if (part.x === x && part.y === y) {
              occupied = true;
              break;
            }
          }
          if (!occupied) {
            food.x = x;
            food.y = y;
            return;
          }
        }
      }
      food.x = 0; food.y = 0;
    }

    function move() {
      dx = nextDx;
      dy = nextDy;
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver(); return;
      }
      for (const part of snake) {
        if (head.x === part.x && head.y === part.y) {
          gameOver(); return;
        }
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        updateScore();
        placeFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      ctx.fillStyle = '#0f0f0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      snake.forEach((part, index) => {
        const color = index === 0 ? '#66bb6a' : '#4caf50';
        ctx.fillStyle = color;
        ctx.fillRect(
          part.x * gridSize + 3,
          part.y * gridSize + 3,
          gridSize - 6,
          gridSize - 6
        );
      });

      ctx.fillStyle = '#ff9800';
      ctx.fillRect(
        food.x * gridSize + 4,
        food.y * gridSize + 4,
        gridSize - 8,
        gridSize - 8
      );
    }

    function loop(timestamp) {
      if (!isGameRunning) { requestAnimationFrame(loop); return; }
      if (timestamp - lastMoveTime >= moveInterval) {
        lastMoveTime = timestamp;
        move();
        draw();
      }
      requestAnimationFrame(loop);
    }

    function startGame() {
      if (isGameRunning) return;
      isGameRunning = true;
      resize();
      resetGame();
      lastMoveTime = performance.now();
      loop(performance.now());
    }

    function gameOver() {
      isGameRunning = false;
      const finalScoreEl = document.getElementById('final-score');
      finalScoreEl.textContent = score;

      const leaderboard = updateLeaderboard(score);
      renderLeaderboard(leaderboard, score);

      document.getElementById('game-over-screen').style.display = 'flex';
    }

    function setDirection(newDx, newDy) {
      if (!(dx === -newDx && dy === -newDy)) {
        nextDx = newDx;
        nextDy = newDy;
      }
    }

    document.getElementById('btn-up').addEventListener('click', () => setDirection(0, -1));
    document.getElementById('btn-down').addEventListener('click', () => setDirection(0, 1));
    document.getElementById('btn-left').addEventListener('click', () => setDirection(-1, 0));
    document.getElementById('btn-right').addEventListener('click', () => setDirection(1, 0));

    document.getElementById('btn-start').addEventListener('click', startGame);
    document.getElementById('btn-restart').addEventListener('click', startGame);

    window.addEventListener('resize', resize);
  </script>
</body>
</html>
