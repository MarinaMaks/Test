<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Змейка</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4caf50">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1a1a1a;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 600px;
      max-height: 900px;
    }

    canvas {
      display: block;
      background: #0f0f0f;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      touch-action: none;
    }

    /* Экран старта и Game Over */
    #start-screen, #game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      text-align: center;
    }
    h1 { margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #ccc; }
    .btn-primary {
      padding: 14px 32px;
      font-size: 18px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-primary:active { background: #388e3c; }

    #score-board {
      position: absolute;
      top: 16px;
      left: 16px;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 1px 1px 2px black;
      z-index: 10;
    }

    /* Блок управления — клавиатура-стиль */
    .controls {
      position: absolute;
      bottom: 80px;        /* Подняли выше, чтобы не было у самого низа */
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: 56px 56px 56px;
      grid-template-rows: 56px 56px 56px;
      gap: 12px;
      z-index: 10;
    }

    button {
      width: 56px;
      height: 56px;
      border: none;
      background: rgba(255,255,255,0.15);
      color: white;
      border-radius: 12px;
      font-size: 24px;
      user-select: none;
      touch-action: manipulation;
    }
    button:active { background: rgba(255,255,255,0.3); }

    /* Позиции кнопок как на клавиатуре */
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 3; }
    #btn-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="score-board">Счёт: <span id="score">0</span></div>
    <canvas id="game" width="400" height="400"></canvas>

    <div id="start-screen">
      <h1>Змейка</h1>
      <p>Нажимай кнопки на экране</p>
      <button class="btn-primary" id="btn-start">Начать игру</button>
    </div>

    <div id="game-over-screen" style="display:none;">
      <h1>Игра окончена</h1>
      <p>Счёт: <span id="final-score">0</span></p>
      <button class="btn-primary" id="btn-restart">Играть снова</button>
    </div>

    <!-- Управление в стиле клавиатуры -->
    <div class="controls">
      <button id="btn-up">&#8593;</button>
      <button id="btn-left">&#8592;</button>
      <button id="btn-down">&#8595;</button>
      <button id="btn-right">&#8594;</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    canvas.tabIndex = 0;

    const gridSize = 20;
    const tileCount = 20;
    const moveInterval = 180;

    let snake = [];
    let food = { x: 15, y: 15 };
    let dx = 1, dy = 0;
    let nextDx = dx, nextDy = dy;
    let score = 0;

    let animationId;
    let isGameRunning = false;
    let lastMoveTime = 0;

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      food = { x: 15, y: 15 };
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      updateScore();
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-over-screen').style.display = 'none';
    }

    function updateScore() {
      document.getElementById('score').textContent = score;
    }

    function placeFood() {
      do {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    function move() {
      dx = nextDx;
      dy = nextDy;
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Столкновение со стенами
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver(); return;
      }
      // Столкновение с собой
      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          gameOver(); return;
        }
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        updateScore();
        placeFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      ctx.fillStyle = '#0f0f0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Сетка (опционально, можно убрать, если мешает)
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1;
      for (let x = 0; x < tileCount; x++) {
        ctx.beginPath(); ctx.moveTo(x * gridSize, 0); ctx.lineTo(x * gridSize, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < tileCount; y++) {
        ctx.beginPath(); ctx.moveTo(0, y * gridSize); ctx.lineTo(canvas.width, y * gridSize); ctx.stroke();
      }

      // Рисуем змейку (ИСПРАВЛЕНО: правильные координаты)
      snake.forEach((part, index) => {
        const color = index === 0 ? '#66bb6a' : '#4caf50';
        ctx.fillStyle = color;
        // Было: part.x * gridSize, part.x * gridSize — ошибка. Теперь: x и y.
        ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
      });

      // Рисуем еду
      ctx.fillStyle = '#ff9800';
      ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
    }

    function loop(timestamp) {
      if (!isGameRunning) { requestAnimationFrame(loop); return; }
      if (timestamp - lastMoveTime >= moveInterval) {
        lastMoveTime = timestamp;
        move();
        draw();
      }
      requestAnimationFrame(loop);
    }

    function startGame() {
      if (isGameRunning) return;
      isGameRunning = true;
      resetGame();
      lastMoveTime = performance.now();
      loop(performance.now());
      canvas.focus();
    }

    function gameOver() {
      isGameRunning = false;
      document.getElementById('final-score').textContent = score;
      document.getElementById('game-over-screen').style.display = 'flex';
    }

    // Управление кнопками
    document.getElementById('btn-up').addEventListener('click', () => { if (dy !== 1) { nextDx = 0; nextDy = -1; } });
    document.getElementById('btn-down').addEventListener('click', () => { if (dy !== -1) { nextDx = 0; nextDy = 1; } });
    document.getElementById('btn-left').addEventListener('click', () => { if (dx !== 1) { nextDx = -1; nextDy = 0; } });
    document.getElementById('btn-right').addEventListener('click', () => { if (dx !== -1) { nextDx = 1; nextDy = 0; } });

    document.getElementById('btn-start').addEventListener('click', startGame);
    document.getElementById('btn-restart').addEventListener('click', startGame);
  </script>
</body>
</html>
