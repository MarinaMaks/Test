<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Змейка</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4caf50">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1a1a1a;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 600px;
      max-height: 900px;
    }

    canvas {
      display: block;
      background: #0f0f0f;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      touch-action: none;
    }

    /* Экран старта и Game Over */
    #start-screen, #game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      text-align: center;
    }
    h1 { margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #ccc; }
    .btn-primary {
      padding: 16px 32px;
      font-size: 18px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-primary:active { background: #388e3c; }

    #score-board {
      position: absolute;
      top: 16px;
      left: 16px;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 1px 1px 2px black;
      z-index: 10;
    }

    /* Блок управления — клавиатура-стиль */
    .controls {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: 56px 56px 56px;
      grid-template-rows: 56px 56px 56px;
      gap: 12px;
      z-index: 10;
    }

    button {
      width: 56px;
      height: 56px;
      border: none;
      background: rgba(255,255,255,0.15);
      color: white;
      border-radius: 12px;
      font-size: 24px;
      user-select: none;
      touch-action: manipulation;
    }
    button:active { background: rgba(255,255,255,0.3); }

    /* Позиции кнопок как на клавиатуре */
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 3; }
    #btn-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="score-board">Счёт: <span id="score">0</span></div>
    <canvas id="game" width="400" height="400"></canvas>

    <div id="start-screen">
      <h1>Змейка</h1>
      <p>Нажимай кнопки на экране</p>
      <button class="btn-primary" id="btn-start">Начать игру</button>
    </div>

    <div id="game-over-screen" style="display:none;">
      <h1>Игра окончена</h1>
      <p>Счёт: <span id="final-score">0</span></p>
      <button class="btn-primary" id="btn-restart">Играть снова</button>
    </div>

    <!-- Управление в стиле клавиатуры -->
    <div class="controls">
      <button id="btn-up">&#8593;</button>
      <button id="btn-left">&#8592;</button>
      <button id="btn-down">&#8595;</button>
      <button id="btn-right">&#8594;</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const gridSize = 20;
    const tileCount = 20;
    // Чуть медленнее, чтобы на телефонах было стабильнее
    const moveInterval = 220; 

    let snake = [];
    let food = { x: 15, y: 15 };
    let dx = 1, dy = 0;
    let nextDx = dx, nextDy = dy;
    let score = 0;

    let animationId;
    let isGameRunning = false;
    let lastMoveTime = 0;

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      // Сразу ставим еду в гарантированно свободное место
      placeFood();
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      updateScore();
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-over-screen').style.display = 'none';
    }

    function updateScore() {
      document.getElementById('score').textContent = score;
    }

    // Надёжная генерация еды: цикл, пока не найдём свободную клетку
    function placeFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);

        valid = true;
        for (let i = 0; i < snake.length; i++) {
          if (food.x === snake[i].x && food.y === snake[i].y) {
            valid = false;
            break;
          }
        }
      }
    }

    function move() {
      dx = nextDx;
      dy = nextDy;
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver(); return;
      }
      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          gameOver(); return;
        }
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        updateScore();
        placeFood(); // Сразу генерируем новую еду
      } else {
        snake.pop();
      }
    }

    function draw() {
      // Полная очистка холста — это важно для мобильных браузеров
      ctx.fillStyle = '#0f0f0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Рисуем змейку
      snake.forEach((part, index) => {
        const color = index === 0 ? '#66bb6a' : '#4caf50';
        ctx.fillStyle = color;
        // Рисуем с небольшим отступом, чтобы не слипались клетки
        ctx.fillRect(
          part.x * gridSize + 2,
          part.y * gridSize + 2,
          gridSize - 4,
          gridSize - 4
        );
      });

      // Рисуем еду (тоже с отступом — так её точно видно)
      ctx.fillStyle = '#ff9800';
      ctx.fillRect(
        food.x * gridSize + 4,
        food.y * gridSize + 4,
        gridSize - 8,
        gridSize - 8
      );
    }

    function loop(timestamp) {
      if (!isGameRunning) { requestAnimationFrame(loop); return; }
      if (timestamp - lastMoveTime >= moveInterval) {
        lastMoveTime = timestamp;
        move();
        draw();
      }
      requestAnimationFrame(loop);
    }

    function startGame() {
      if (isGameRunning) return;
      isGameRunning = true;
      resetGame();
      lastMoveTime = performance.now();
      loop(performance.now());
    }

    function gameOver() {
      isGameRunning = false;
      document.getElementById('final-score').textContent = score;
      document.getElementById('game-over-screen').style.display = 'flex';
    }

    // Управление кнопками
    function setDirection(newDx, newDy) {
      // Нельзя развернуться на 180 градусов
      if (!(dx === -newDx && dy === -newDy)) {
        nextDx = newDx;
        nextDy = newDy;
      }
    }

    document.getElementById('btn-up').addEventListener('click', () => setDirection(0, -1));
    document.getElementById('btn-down').addEventListener('click', () => setDirection(0, 1));
    document.getElementById('btn-left').addEventListener('click', () => setDirection(-1, 0));
    document.getElementById('btn-right').addEventListener('click', () => setDirection(1, 0));

    document.getElementById('btn-start').addEventListener('click', startGame);
    document.getElementById('btn-restart').addEventListener('click', startGame);
  </script>
</body>
</html>
