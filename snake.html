<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Змейка</title>
  <!-- manifest убираем, чтобы не было PWA и кэша -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #1a1a1a;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 600px;
      max-height: 900px;
      /* Центрируем, если экран очень широкий */
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      background: #0f0f0f;
      touch-action: none;
      image-rendering: pixelated; /* Чтобы не размывалось при масштабировании */
    }
    /* Экран старта и Game Over */
    #start-screen, #game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 20px; color: #ccc; font-size: 16px; }
    .btn-primary {
      padding: 18px 36px;
      font-size: 18px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
    }
    .btn-primary:active { background: #388e3c; }

    #score-board {
      position: absolute;
      top: 14px;
      left: 14px;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 1px 1px 2px black;
      z-index: 10;
    }

    /* Блок управления */
    .controls {
      position: absolute;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: 64px 64px 64px;
      grid-template-rows: 64px 64px 64px;
      gap: 12px;
      z-index: 10;
    }
    button {
      width: 64px;
      height: 64px;
      border: none;
      background: rgba(255,255,255,0.12);
      color: white;
      border-radius: 14px;
      font-size: 28px;
      user-select: none;
      touch-action: manipulation;
      outline: none;
    }
    button:active { background: rgba(255,255,255,0.35); }

    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 3; }
    #btn-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="score-board">Счёт: <span id="score">0</span></div>
    <!-- canvas без фиксированных width/height -->
    <canvas id="game"></canvas>

    <div id="start-screen">
      <h1>Змейка</h1>
      <p>Нажимай кнопки на экране</p>
      <button class="btn-primary" id="btn-start">Начать игру</button>
    </div>

    <div id="game-over-screen" style="display:none;">
      <h1>Игра окончена</h1>
      <p>Счёт: <span id="final-score">0</span></p>
      <button class="btn-primary" id="btn-restart">Играть снова</button>
    </div>

    <div class="controls">
      <button id="btn-up">&#8593;</button>
      <button id="btn-left">&#8592;</button>
      <button id="btn-down">&#8595;</button>
      <button id="btn-right">&#8594;</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Параметры игры
    let tileCount = 20; // По умолчанию 20x20
    let gridSize = 0;   // Будет рассчитан под экран
    const moveInterval = 260; // Стабильно на мобильных

    let snake = [];
    let food = { x: 15, y: 15 };
    let dx = 1, dy = 0;
    let nextDx = dx, nextDy = dy;
    let score = 0;

    let animationId;
    let isGameRunning = false;
    let lastMoveTime = 0;

    function resize() {
      const container = document.getElementById('game-container');
      const cw = container.clientWidth;
      const ch = container.clientHeight;

      // Выбираем размер поля под экран: на узких телефонах делаем 16x16, иначе 20x20
      tileCount = (cw < 420) ? 16 : 20;

      // Подбираем размер клетки так, чтобы поле занимало максимум места, но не вылезало
      const maxTileSize = Math.floor(Math.min(cw, ch) / tileCount);
      gridSize = maxTileSize;

      canvas.width = tileCount * gridSize;
      canvas.height = tileCount * gridSize;
    }

    function resetGame() {
      snake = [
        { x: Math.floor(tileCount/2), y: Math.floor(tileCount/2) },
        { x: Math.floor(tileCount/2)-1, y: Math.floor(tileCount/2) },
        { x: Math.floor(tileCount/2)-2, y: Math.floor(tileCount/2) }
      ];
      placeFood();
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      updateScore();
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-over-screen').style.display = 'none';
    }

    function updateScore() {
      document.getElementById('score').textContent = score;
    }

    function placeFood() {
      const maxAttempts = 200;
      for (let i = 0; i < maxAttempts; i++) {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);

        let occupied = false;
        for (const part of snake) {
          if (part.x === food.x && part.y === food.y) {
            occupied = true;
            break;
          }
        }
        if (!occupied) return;
      }

      // Фолбэк: ищем первую свободную клетку
      for (let x = 0; x < tileCount; x++) {
        for (let y = 0; y < tileCount; y++) {
          let occupied = false;
          for (const part of snake) {
            if (part.x === x && part.y === y) {
              occupied = true;
              break;
            }
          }
          if (!occupied) {
            food.x = x;
            food.y = y;
            return;
          }
        }
      }
      food.x = 0; food.y = 0;
    }

    function move() {
      dx = nextDx;
      dy = nextDy;
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver(); return;
      }
      for (const part of snake) {
        if (head.x === part.x && head.y === part.y) {
          gameOver(); return;
        }
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        updateScore();
        placeFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      ctx.fillStyle = '#0f0f0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      snake.forEach((part, index) => {
        const color = index === 0 ? '#66bb6a' : '#4caf50';
        ctx.fillStyle = color;
        // Отступы внутри клетки, чтобы сегменты не слипались
        ctx.fillRect(
          part.x * gridSize + 3,
          part.y * gridSize + 3,
          gridSize - 6,
          gridSize - 6
        );
      });

      ctx.fillStyle = '#ff9800';
      ctx.fillRect(
        food.x * gridSize + 4,
        food.y * gridSize + 4,
        gridSize - 8,
        gridSize - 8
      );
    }

    function loop(timestamp) {
      if (!isGameRunning) { requestAnimationFrame(loop); return; }
      if (timestamp - lastMoveTime >= moveInterval) {
        lastMoveTime = timestamp;
        move();
        draw();
      }
      requestAnimationFrame(loop);
    }

    function startGame() {
      if (isGameRunning) return;
      isGameRunning = true;
      resize(); // Пересчитать размеры перед стартом
      resetGame();
      lastMoveTime = performance.now();
      loop(performance.now());
    }

    function gameOver() {
      isGameRunning = false;
      document.getElementById('final-score').textContent = score;
      document.getElementById('game-over-screen').style.display = 'flex';
    }

    function setDirection(newDx, newDy) {
      if (!(dx === -newDx && dy === -newDy)) {
        nextDx = newDx;
        nextDy = newDy;
      }
    }

    document.getElementById('btn-up').addEventListener('click', () => setDirection(0, -1));
    document.getElementById('btn-down').addEventListener('click', () => setDirection(0, 1));
    document.getElementById('btn-left').addEventListener('click', () => setDirection(-1, 0));
    document.getElementById('btn-right').addEventListener('click', () => setDirection(1, 0));

    document.getElementById('btn-start').addEventListener('click', startGame);
    document.getElementById('btn-restart').addEventListener('click', startGame);

    window.addEventListener('resize', resize);
  </script>
</body>
</html>
